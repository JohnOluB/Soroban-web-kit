name: Deploy Soroban Token Contract

on:
  workflow_dispatch:
    inputs:
      network:
        description: 'Network to deploy to'
        required: true
        default: 'testnet'
        type: choice
        options:
          - testnet
          - mainnet

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/**/Cargo.lock') }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config libudev-dev libhidapi-dev

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli

      - name: Debug file structure
        run: |
          find . -name "Cargo.toml" | head -20
          ls -la contracts/
          ls -la contracts/token/

      - name: Deploy to testnet
        if: ${{ inputs.network == 'testnet' }}
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_SECRET_KEY }}
        run: |
          stellar keys add deployer --secret-key "$STELLAR_SECRET_KEY"
          stellar contract deploy \
            --wasm contracts/target/wasm32-unknown-unknown/release/soroban_token.wasm \
            --source deployer \
            --network testnet \
            --rpc-url https://soroban-testnet.stellar.org \
            --network-passphrase "Test SDF Network ; September 2015"

      - name: Deploy to mainnet
        if: ${{ inputs.network == 'mainnet' }}
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_MAINNET_SECRET_KEY }}
        run: |
          stellar keys add deployer --secret-key "$STELLAR_SECRET_KEY"
          stellar contract deploy \
            --wasm contracts/target/wasm32-unknown-unknown/release/soroban_token.wasm \
            --source deployer \
            --network mainnet \
            --rpc-url https://mainnet.stellar.validations.stellar.org \
            --network-passphrase "Public Global Stellar Network ; September 2015"