name: Deploy Soroban Token Contract

on:
  workflow_dispatch:
    inputs:
      network:
        description: 'Network to deploy to'
        required: true
        default: 'testnet'
        type: choice
        options:
          - testnet
          - mainnet
  push:
    branches:
      - main
    paths:
      - 'contracts/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config libudev-dev libhidapi-dev

      - name: Install Rust stable for Stellar CLI
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli

      - name: Install Rust for contract build
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32v1-none

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: "${{ runner.os }}-cargo-v3-${{ hashFiles('contracts/**/Cargo.lock') }}"

      - name: Build contract
        working-directory: contracts
        run: |
          cargo generate-lockfile
          cargo build --target wasm32v1-none --release
          ls target/wasm32v1-none/release/*.wasm

      - name: Deploy to testnet
        if: ${{ inputs.network == 'testnet' }}
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_SECRET_KEY }}
        run: |
          echo "$STELLAR_SECRET_KEY" | stellar keys add deployer --stdin
          stellar contract deploy \
            --wasm contracts/target/wasm32v1-none/release/soroban_token.wasm \
            --source deployer \
            --network testnet \
            --rpc-url https://soroban-testnet.stellar.org \
            --network-passphrase "Test SDF Network ; September 2015"

      - name: Deploy to mainnet
        if: ${{ inputs.network == 'mainnet' }}
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_MAINNET_SECRET_KEY }}
        run: |
          echo "$STELLAR_SECRET_KEY" | stellar keys add deployer --stdin
          stellar contract deploy \
            --wasm contracts/target/wasm32v1-none/release/soroban_token.wasm \
            --source deployer \
            --network mainnet \
            --rpc-url https://mainnet.stellar.validations.stellar.org \
            --network-passphrase "Public Global Stellar Network ; September 2015"